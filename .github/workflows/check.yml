name: Check Hull contest
run-name: Verify ${{ inputs.revision || github.sha }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      revision:
        description: Commit SHA to fully verify and package (empty means current main)
        type: string

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.sha }}-${{ inputs.revision }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      problems: ${{ steps.plan.outputs.problems }}
      statements: ${{ steps.plan.outputs.statements }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test scaffold and sample consistency
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_samples.py
      - name: Test CI selection and artifact rules
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Select verification scope
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 .github/scripts/plan.py --base "$PR_BASE" --head "$PR_HEAD" --output "$GITHUB_OUTPUT"
          else
            python3 .github/scripts/plan.py --full --output "$GITHUB_OUTPUT"
          fi
  check:
    needs: plan
    uses: ./.github/workflows/build.yml
    with:
      revision: ${{ inputs.revision || github.sha }}
      full: ${{ needs.plan.outputs.full == 'true' }}
      problems: ${{ needs.plan.outputs.problems }}
      statements: ${{ needs.plan.outputs.statements == 'true' }}
    secrets: inherit
